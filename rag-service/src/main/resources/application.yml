server:
  port: 8082

spring:
  application:
    name: rag-service

pgvector:
  host: ${PGVECTOR_HOST:localhost}
  port: ${PGVECTOR_PORT:5432}
  database: ${PGVECTOR_DB:upgradepilot}
  user: ${PGVECTOR_USER:upgradepilot}
  password: ${PGVECTOR_PASSWORD:upgradepilot}
  table: doc_embeddings

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}

rag:
  docs-path: ${RAG_DOCS_PATH:./rag-service/docs-corpus}
  max-results: 4
  min-score: 0.55
